server.port: ${SERVER_PORT:8082}
spring:
  application.name: processing-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: eventlens-indexers
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: dev.eventlens.model
        isolation.level: read_committed
        max.poll.records: 100
    listener:
      ack-mode: manual_immediate
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
management:
  endpoints.web.exposure.include: health,info,metrics
  endpoint.health.probes.enabled: true
eventlens:
  kafka:
    raw-topic: eventlens.logs.raw
    dead-letter-topic: eventlens.logs.dead-letter
  opensearch.url: ${OPENSEARCH_URL:http://localhost:9200}
  processing:
    max-attempts: ${INDEX_MAX_ATTEMPTS:3}
    backoff-ms: ${INDEX_BACKOFF_MS:1000}

