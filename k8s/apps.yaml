apiVersion: apps/v1
kind: Deployment
metadata: {name: ingestion-service, namespace: eventlens}
spec:
  replicas: 2
  selector: {matchLabels: {app: ingestion-service}}
  template:
    metadata: {labels: {app: ingestion-service}}
    spec:
      containers:
        - name: ingestion
          image: ghcr.io/your-user/eventlens-ingestion:latest
          ports: [{containerPort: 8081}]
          envFrom:
            - configMapRef: {name: eventlens-config}
            - secretRef: {name: eventlens-secrets}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8081}, initialDelaySeconds: 20, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: 8081}, initialDelaySeconds: 30, periodSeconds: 15}
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata: {name: ingestion-service, namespace: eventlens}
spec: {selector: {app: ingestion-service}, ports: [{port: 8081, targetPort: 8081}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: processing-service, namespace: eventlens}
spec:
  replicas: 3
  selector: {matchLabels: {app: processing-service}}
  template:
    metadata: {labels: {app: processing-service}}
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: processing
          image: ghcr.io/your-user/eventlens-processing:latest
          ports: [{containerPort: 8082}]
          envFrom: [{configMapRef: {name: eventlens-config}}]
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8082}, initialDelaySeconds: 20, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: 8082}, initialDelaySeconds: 30, periodSeconds: 15}
          resources:
            requests: {cpu: 300m, memory: 384Mi}
            limits: {cpu: "2", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata: {name: processing-service, namespace: eventlens}
spec: {selector: {app: processing-service}, ports: [{port: 8082, targetPort: 8082}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: query-service, namespace: eventlens}
spec:
  replicas: 2
  selector: {matchLabels: {app: query-service}}
  template:
    metadata: {labels: {app: query-service}}
    spec:
      containers:
        - name: query
          image: ghcr.io/your-user/eventlens-query:latest
          ports: [{containerPort: 8083}]
          envFrom:
            - configMapRef: {name: eventlens-config}
            - secretRef: {name: eventlens-secrets}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8083}, initialDelaySeconds: 20, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: 8083}, initialDelaySeconds: 30, periodSeconds: 15}
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata: {name: query-service, namespace: eventlens}
spec: {selector: {app: query-service}, ports: [{port: 8083, targetPort: 8083}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: eventlens}
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
        - name: frontend
          image: ghcr.io/your-user/eventlens-frontend:latest
          ports: [{containerPort: 80}]
          readinessProbe: {httpGet: {path: /health, port: 80}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: 80}, initialDelaySeconds: 10, periodSeconds: 15}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: eventlens}
spec: {type: LoadBalancer, selector: {app: frontend}, ports: [{port: 80, targetPort: 80}]}

