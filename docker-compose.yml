name: eventlens
services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: eventlens
      POSTGRES_USER: ${DATABASE_USERNAME:-eventlens}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-eventlens_dev}
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock: {soft: -1, hard: -1}
    ports: ["9200:9200", "9600:9600"]
    volumes: ["opensearch-data:/usr/share/opensearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  ingestion-service:
    build: {context: ., dockerfile: services/ingestion-service/Dockerfile}
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DATABASE_URL: jdbc:postgresql://postgres:5432/eventlens
      DATABASE_USERNAME: ${DATABASE_USERNAME:-eventlens}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-eventlens_dev}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10000}
    ports: ["8081:8081"]
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20

  processing-service:
    build: {context: ., dockerfile: services/processing-service/Dockerfile}
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OPENSEARCH_URL: http://opensearch:9200
      HOSTNAME: ${HOSTNAME:-processing-local}
    ports: ["8082"]
    depends_on:
      kafka: {condition: service_healthy}
      opensearch: {condition: service_healthy}
      ingestion-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health/liveness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20

  query-service:
    build: {context: ., dockerfile: services/query-service/Dockerfile}
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OPENSEARCH_URL: http://opensearch:9200
      DATABASE_URL: jdbc:postgresql://postgres:5432/eventlens
      DATABASE_USERNAME: ${DATABASE_USERNAME:-eventlens}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-eventlens_dev}
    ports: ["8083:8083"]
    depends_on:
      kafka: {condition: service_healthy}
      opensearch: {condition: service_healthy}
      ingestion-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    build: {context: ., dockerfile: frontend/Dockerfile}
    ports: ["3000:80"]
    depends_on:
      query-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  kafka-data:
  opensearch-data:

